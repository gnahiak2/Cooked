<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Cooked!</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>🍳 Cooked</h1>
  <p>You were never meant to cook this.</p>
  
  <div class="row">
    <button id="cook">COOK</button>
    <button id="worse">MAKE IT WORSE</button>
  </div>

  <pre id="output">awaiting culinary disaster...</pre>
  <img id="dishImage" />

  <div id="loadingOverlay" class="loading-overlay" aria-live="polite" aria-hidden="true">
    <div class="loading-content">
      <div class="loading-spinner"></div>
      <p id="loadingText">Cooking...</p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
